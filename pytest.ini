[pytest]
; Adds the repo root to sys.path so tests can `import config`,
; `from data.bundle import ...` etc. the same way main.py/webapp/app.py do,
; without needing an installable package/setup.py.
pythonpath = .
testpaths = tests

markers =
    live: hits a real external API (yfinance, SEC EDGAR, StockTwits) -- slow,
        network-dependent, and can fail for reasons unrelated to code
        correctness (market closed, rate limits). Excluded by default (see
        addopts below); run explicitly with `pytest -m live`. Never run in CI.

; Excludes `live`-marked tests by default so a bare `pytest` (and CI's
; `pytest -m "not live"`) both skip them without needing -m every time.
; Run `pytest -m live` to run only the live ones instead.
addopts = -m "not live"
